<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>КартЭдит — демо в браузере</title>

  <!-- ECharts + Ag-Grid: локальные копии рядом с программой, интернет не нужен.
       Суммы файлов записаны в static/vendor/vendor_lock.json -->
  <script src="/demo/static/echarts.min.js"></script>
  <script src="/demo/static/ag-grid-community.min.js"></script>
  <link rel="stylesheet" href="/demo/static/ag-grid.css" />
  <link rel="stylesheet" href="/demo/static/ag-theme-balham.css" />
  <script>
    /* #A23 (18.08.2026, аудит): график и таблица тянулись с ВНЕШНИХ CDN, а
       поставка — ДЕСКТОПНАЯ; без интернета echarts.init падал в необработанном
       исключении, и покупатель видел пустое окно без единого слова о причине.
       Библиотеки положены рядом с программой (tools/vendor_assets.py), но
       проверка остаётся: файл рядом может не загрузиться так же, как и чужой —
       битая копия, вырезанный антивирусом кусок, урезанная сборка exe. Теги
       выше синхронные, поэтому здесь уже точно известно, загрузились они или
       нет. Текст сообщения ниже исправлен 06.09.2026: он всё ещё отправлял
       покупателя «проверить интернет», хотя интернет тут ни при чём. */
    window.__KE_LIBS_MISSING__ = [];
    if (typeof window.echarts === "undefined") window.__KE_LIBS_MISSING__.push("ECharts — график");
    if (typeof window.agGrid === "undefined") window.__KE_LIBS_MISSING__.push("Ag-Grid — таблица");
  </script>

  <link rel="icon" href="data:," />
  <script>
    /* ДЕМО (tools/build_demo.py): все /api/* уходят в /demo/api/* — заглушки
       server/app.py; токен и версия статики — постоянные. */
    window.ASC_TOKEN = "demo";
    window.ASC_BOOT_VER = 1;
    window.KE_DEFAULT_TITLE = "КартЭдит — ДЕМО";
    (function () {
      var orig = window.fetch.bind(window);
      window.fetch = function (url, opts) {
        if (typeof url === "string" && url.indexOf("/api/") === 0) url = "/demo" + url;
        return orig(url, opts);
      };
    })();
  </script>

      </div>

        <button class="tb-icon" id="btn-undo" title="Отменить (Ctrl+Z)">↶</button>

        <div id="hist-menu" class="ctx-menu tb-drop" style="display:none"></div>

        <button class="tb-icon" id="btn-diff" title="Сравнить с исходником: что изменилось с момента открытия файла. Сравниваются два файла на диске — несохранённые правки в отчёт не войдут">⇄</button>
      </div>
      <div class="tb-group">
        <button class="tb-icon" id="btn-draw" title="Рисование (клавиша 0): тянуть ЛКМ — прорисовать/подрезать линию канала. Протяжка ровно вправо — спуско-подъёмная операция (трапеция)">✎</button>
        <button class="tb-icon" id="btn-erase" title="Стёрка (ластик): тянуть ЛКМ по графику — значения активного канала обнуляются. Esc — выход">⌫</button>
      </div>
      <div class="tb-group" style="position:relative">

        <div id="noise-pop" class="tb-pop" style="display:none">
          <div class="np-row">
            <span>Шум</span>

        </div>
      </div>
      <div class="tb-group" style="position:relative">

            <input type="range" id="dim-range" min="5" max="100" value="60" />

        </div>
      </div>

      <div class="tb-group" id="demo-cta" style="margin-left:auto;gap:6px">

            <div class="np-row" id="license-exp-row" style="display:none"></div>

    <!-- ===== MAIN WORKSPACE ===== -->
    <div id="workspace">

      <!-- LEFT SIDEBAR: дерево (40%) + AI (60%) -->

        </div>

        <div id="tree-resizer" class="resizer h-resizer" title="Потяните — высота дерева / AI"></div>

        <!-- низ: AI-ассистент -->
        <div id="ai-section">

          <div id="ai-intervals" style="display:none"></div>

          <div id="ai-context" style="display:none"></div>

        </div>

      </aside>

      <!-- перетаскиваемая граница панель / контент -->

        <!-- график -->

  <script>
    /* #A23: сообщение вместо пустого окна. Стоит ДО app.js сознательно — если
       библиотек нет, app.js всё равно упадёт, и объяснение должно быть на
       экране раньше. Адрес поддержки — тот же, что в оферте. */
    (function () {
      var miss = window.__KE_LIBS_MISSING__ || [];
      if (!miss.length) return;
      var d = document.createElement("div");
      d.style.cssText = "position:fixed;inset:0;z-index:99999;background:#11161d;color:#e6edf5;" +
        "font:14px/1.5 system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:32px";
      var box = document.createElement("div");
      box.style.cssText = "max-width:620px";
      var h = document.createElement("div");
      h.style.cssText = "font-size:18px;font-weight:600;margin-bottom:12px";
      h.textContent = "Не загрузились компоненты интерфейса";
      var p1 = document.createElement("p");
      p1.textContent = "Не удалось загрузить: " + miss.join(", ") + ". Эти компоненты входят в состав " +
        "программы и лежат рядом с ней — интернет для них не нужен.";
      var p2 = document.createElement("p");
      p2.textContent = "Что сделать: запустите программу заново. Если окно снова пустое — файлы " +
        "интерфейса повреждены или удалены антивирусом; переустановите программу из дистрибутива " +
        "с сайта и проверьте карантин антивируса.";
      var p3 = document.createElement("p");
      p3.style.cssText = "opacity:.75";
      p3.textContent = "Поддержка: support@kartedit.ru";
      box.appendChild(h); box.appendChild(p1); box.appendChild(p2); box.appendChild(p3);
      d.appendChild(box);
      document.body.appendChild(d);
    })();
  </script>

  <div style="position:fixed;top:45%;left:50%;transform:translate(-50%,-50%) rotate(-18deg);

  <div id="demo-toast" style="display:none;position:fixed;left:50%;top:64px;transform:translateX(-50%);
       max-width:520px;background:#1d2733;color:#fff;font:14px/1.45 system-ui,sans-serif;padding:12px 16px;
       border-radius:6px;box-shadow:0 4px 18px rgba(0,0,0,.25);z-index:10000"></div>
  <script>
    /* ДЕМО: открыть/сохранить недоступны. Перехват на window в фазе захвата —
       раньше любых обработчиков app.js, в каком бы порядке они ни вешались. */
    (function () {
      var msg = "Недоступно в демо-версии. Чтобы открывать и сохранять свои файлы .asc3, установите программу: бесплатный пробный период 7 дней (кнопка «Скачать» вверху).", timer = null;
      function say() {
        var t = document.getElementById("demo-toast");
        t.textContent = msg; t.style.display = "";
        clearTimeout(timer); timer = setTimeout(function () { t.style.display = "none"; }, 6000);
      }
      ["btn-open", "btn-save", "btn-saveas"].forEach(function (id) {
        var b = document.getElementById(id);
        if (b) b.style.opacity = ".45";
      });
      window.addEventListener("click", function (e) {
        var b = e.target && e.target.closest && e.target.closest("#btn-open,#btn-save,#btn-saveas");
        if (!b) return;
        e.stopImmediatePropagation(); e.preventDefault(); say();
      }, true);
      window.addEventListener("keydown", function (e) {
        if ((e.ctrlKey || e.metaKey) && ["s", "o", "S", "O", "ы", "щ", "Ы", "Щ"].indexOf(e.key) >= 0) {
          e.preventDefault(); e.stopImmediatePropagation(); say();
        }
      }, true);
    })();
    /* ДЕМО: при открытии выбраны ПЕРВЫЕ сутки, а не обе сразу — выделенные двое суток
       выглядят непонятно. Вторые сутки посетитель выбирает сам кликом в дереве.
       Это обычный клик по строке суток, то есть ровно то, что сделал бы пользователь. */
    (function () {
      var tries = 0, h = setInterval(function () {
        var d = document.querySelector('#tree .tree-child[data-day="0"]');
        if (d) { clearInterval(h); d.click(); }
        else if (++tries > 100) clearInterval(h);
      }, 100);
    })();
  </script>
